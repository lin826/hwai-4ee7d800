[project]
name = "eng-interview-homework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
ai-eng = [
    "anthropic>=1.8.0",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
