[project]
name = "eng-interview-homework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
health-context = "health_context.cli:main"

[dependency-groups]
ai-eng = [
    "anthropic>=1.8.0",
]
dev = [
    { include-group = "serve" },
    "httpx>=0.28.1",
    "pytest>=8",
]
serve = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
